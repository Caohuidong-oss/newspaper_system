{% extends "base.html" %}
{% block title %}登录{% endblock %}

{% block content %}
<div class="row justify-content-center" style="margin-top: 60px;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 overflow-hidden">
            <div class="card-body p-4 text-white text-center"
                 style="background: linear-gradient(135deg, #667eea, #764ba2);">
                <div class="mb-2" style="font-size: 3rem;">📰</div>
                <h3 class="fw-bold mb-1">报刊订阅系统</h3>
                <small class="opacity-75">登录以继续</small>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-bold text-muted">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">👤</span>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="请输入用户名" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label small fw-bold text-muted">密码</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">🔒</span>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="请输入密码" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm"
                            style="background: linear-gradient(135deg, #667eea, #764ba2); border: none;">
                        🔐 登 录
                    </button>
                </form>
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('forgot_password') }}" class="text-decoration-none small text-muted">🔐 忘记密码？</a>
                    <small class="text-muted">还没有账号？<a href="{{ url_for('register') }}" class="fw-bold">立即注册</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
