{% extends "base.html" %}
{% block title %}修改密码{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('index') }}" class="text-decoration-none">首页</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('profile') }}" class="text-decoration-none">个人中心</a></li>
                <li class="breadcrumb-item active" aria-current="page">修改密码</li>
            </ol>
        </nav>

        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">🔒 修改密码</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info small">
                    <strong>📌 提示：</strong>修改成功后需要重新登录
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label for="old_password" class="form-label">原密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="old_password" name="old_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">新密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="new_password" name="new_password"
                               minlength="6" required>
                        <small class="text-muted">密码长度不少于 6 位</small>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">确认新密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                               minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100">🔐 确认修改</button>
                </form>
            </div>
            <div class="card-footer text-center">
                <a href="{{ url_for('profile') }}" class="text-decoration-none">⬅️ 返回个人中心</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
